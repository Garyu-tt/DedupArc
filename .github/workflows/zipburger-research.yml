name: NeuroCrunch ZipBurger independent Python QA

on:
  pull_request:
    paths:
      - 'experiments/zipburger/**'
      - 'tests/test_zipburger*.py'
      - '.github/workflows/zipburger-research.yml'
  push:
    branches: ['experiment/zipburger-*']
    paths:
      - 'experiments/zipburger/**'
      - 'tests/test_zipburger*.py'
      - '.github/workflows/zipburger-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zipburger-research-${{ github.event.pull_request.number || github.ref }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  python-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bounded research dependency
        run: python -m pip install 'numpy>=1.26,<3' 'safetensors>=0.4,<1'
      - name: Compile research modules and tests
        run: python -m compileall -q experiments/zipburger tests
      - name: Verify all ZipBurger R01-R03 and GGUF tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -p 'test_zipburger*.py' -v
      - name: Synthetic MXFP4 benchmark smoke (no model download)
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m experiments.zipburger.bench_r03

      - name: R08 honest 3-bit vs exact on synthetic slices
        if: matrix.python-version == '3.12'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m experiments.zipburger.bench_layerwise_r08
      - name: R08 pinned public GPT-OSS-20B bounded real expert fragments
        if: matrix.python-version == '3.12'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m experiments.zipburger.bench_layerwise_r08 --real
