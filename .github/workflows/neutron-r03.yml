name: Neutron R03 research validation

on:
  push:
    branches:
      - experiment/neutron-r03-math-dag
  pull_request:
    paths:
      - 'internal/archive/**'
      - 'cmd/deduparc/**'
      - '.github/workflows/neutron-r03.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Go tests
        run: go test ./...
      - name: Static checks
        run: go vet ./...
      - name: R03 explicit roundtrip / malformed references
        run: go test -count=1 -v ./internal/archive -run 'TestNeutronDAG|TestMathReference'
      - name: Build CLI
        run: go build -o deduparc-core ./cmd/deduparc
      - name: R02 synthetic regression benchmark
        run: python3 scripts/benchmark_extreme.py --binary ./deduparc-core --workdir /tmp/neutron-r03-bench
      - name: Verify benchmark output
        run: cat /tmp/neutron-r03-bench/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neutron-r03-r02-regression
          path: /tmp/neutron-r03-bench/results.json
