name: Neutron R02 research benchmark

on:
  push:
    branches:
      - experiment/neutron-r02-math-bytecode
    paths:
      - 'internal/archive/**'
      - 'cmd/deduparc/**'
      - 'scripts/benchmark_extreme.py'
      - '.github/workflows/neutron-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Neutron integration and density tests
        run: go test -v ./internal/archive -run 'TestNeutron|TestMath'
      - name: Build CLI
        run: go build -o deduparc-core ./cmd/deduparc
      - name: Full lossless synthetic comparison with integrity checks
        run: python3 scripts/benchmark_extreme.py --binary ./deduparc-core --workdir /tmp/deduparc-neutron-r02
      - name: Print reproducible results
        run: cat /tmp/deduparc-neutron-r02/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: neutron-r02-benchmark-results
          path: /tmp/deduparc-neutron-r02/results.json
